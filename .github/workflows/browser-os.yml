name: Build nOS Browser OS ISO

on:
  push:
    branches: [ "main" ]
    paths:
      - "browser-os/**"
      - ".github/workflows/browser-os.yml"
  workflow_dispatch:

concurrency:
  group: browser-os-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso \
            squashfs-tools \
            qemu-system-x86 \
            qemu-utils \
            syslinux-common \
            isolinux \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            socat \
            debootstrap \
            debian-archive-keyring

      # Ubuntu's live-build is a 2012-era fork that lacks modern options;
      # use Debian's own live-build (pure shell scripts) to build bookworm.
      - name: Install Debian live-build
        run: |
          curl -fsSL -o /tmp/live-build.deb \
            http://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          sudo dpkg -i /tmp/live-build.deb
          lb --version || true

      - name: Build nOS browser ISO
        run: sudo -E bash browser-os/build.sh

      - name: Verify built rootfs contents
        run: |
          SQ=/tmp/nOS-live-build/binary/live/filesystem.squashfs
          test -f "$SQ" || { echo "no squashfs at $SQ"; exit 1; }
          sudo unsquashfs -dest /tmp/nos-rootfs "$SQ" > /dev/null
          fail=0
          # squashfs symlinks are absolute and dangle after unsquashfs, so
          # test with -L (link exists) as well as -e (target resolves)
          check() { if [ -e "$2" ] || [ -L "$2" ]; then echo "OK   $1"; else echo "MISS $1: $2"; fail=1; fi }
          check chromium     /tmp/nos-rootfs/usr/bin/chromium
          check homepage     /tmp/nos-rootfs/opt/nos/index.html
          check notes        /tmp/nos-rootfs/opt/nos/apps/notes/index.html
          check xsession     /tmp/nos-rootfs/etc/nos/xsession
          check launcher     /tmp/nos-rootfs/etc/nos/nos-browser
          check policies     /tmp/nos-rootfs/etc/chromium/policies/managed/nos.json
          check nodm-unit    /tmp/nos-rootfs/lib/systemd/system/nodm.service
          grep -q '^nos:' /tmp/nos-rootfs/etc/passwd || { echo "MISS user nos"; fail=1; }
          test -x /tmp/nos-rootfs/etc/nos/xsession || { echo "MISS exec bit: xsession"; fail=1; }
          test -x /tmp/nos-rootfs/etc/nos/nos-browser || { echo "MISS exec bit: nos-browser"; fail=1; }
          if [ -e /tmp/nos-rootfs/etc/systemd/system/multi-user.target.wants/nodm.service ] \
             || [ -e /tmp/nos-rootfs/etc/systemd/system/graphical.target.wants/nodm.service ] \
             || [ -e /tmp/nos-rootfs/etc/systemd/system/display-manager.service ]; then
            echo "OK   nodm enabled"
          else
            echo "MISS nodm not enabled"; fail=1
          fi
          check default-target /tmp/nos-rootfs/etc/systemd/system/default.target
          ls -la browser-os/nOS-browser-amd64.iso
          echo "--- /etc/systemd/system in rootfs ---"
          ls -la /tmp/nos-rootfs/etc/systemd/system/ || true
          ls -la /tmp/nos-rootfs/etc/systemd/system/multi-user.target.wants/ || true
          exit $fail

      - name: Boot-test the ISO in QEMU (headless, serial markers + screenshot)
        run: |
          rm -f serial.log /tmp/qmon.sock /tmp/nos-screen.ppm
          timeout 600 qemu-system-x86_64 -machine q35 -cpu max -m 2048 -smp 2 \
            -cdrom browser-os/nOS-browser-amd64.iso \
            -display none -no-reboot \
            -netdev user,id=n0 -device e1000,netdev=n0 \
            -monitor unix:/tmp/qmon.sock,server,nowait \
            -serial file:serial.log &
          QPID=$!
          for i in $(seq 1 100); do
            grep -q NOS_X_READY serial.log 2>/dev/null && break
            sleep 6
          done
          if ! grep -q NOS_X_READY serial.log; then
            echo "ERROR: X session never became ready"
            tail -n 120 serial.log || true
            kill "$QPID" 2>/dev/null || true
            exit 1
          fi
          sleep 60   # give Chromium time to render under TCG
          echo screendump /tmp/nos-screen.ppm | socat - UNIX-CONNECT:/tmp/qmon.sock || true
          sleep 2
          kill "$QPID" 2>/dev/null || true
          wait "$QPID" 2>/dev/null || true
          echo "--- Serial output (tail) ---"
          tail -n 120 serial.log || true
          ls -la /tmp/nos-screen.ppm || true

      - name: Checksums
        run: |
          cd browser-os
          sha256sum nOS-browser-amd64.iso > SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nOS-browser-iso
          path: |
            browser-os/nOS-browser-amd64.iso
            browser-os/SHA256SUMS
          retention-days: 30

      - name: Upload boot-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nOS-boot-test
          path: |
            serial.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view browser-os-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create browser-os-latest --repo "$GITHUB_REPOSITORY" \
                 --title "nOS Browser OS (latest)" \
                 --notes "Rolling build of the nOS browser-only ISO. The whole OS is a browser: it boots straight into fullscreen Chromium. See the README for boot and usage notes."
          gh release upload browser-os-latest \
            browser-os/nOS-browser-amd64.iso browser-os/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit browser-os-latest --repo "$GITHUB_REPOSITORY" --latest
